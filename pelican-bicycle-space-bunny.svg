<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1033"/>
      <stop offset="0.6" stop-color="#1b2a5e"/>
      <stop offset="1" stop-color="#3b3f7a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="60" r="2"/><circle cx="130" cy="120" r="1.5"/>
    <circle cx="210" cy="45" r="2.5"/><circle cx="300" cy="90" r="1.5"/>
    <circle cx="380" cy="40" r="1.5"/><circle cx="455" cy="105" r="2"/>
    <circle cx="540" cy="55" r="1.5"/><circle cx="610" cy="130" r="2.5"/>
    <circle cx="700" cy="70" r="1.5"/><circle cx="760" cy="150" r="2"/>
    <circle cx="95" cy="200" r="1.5"/><circle cx="740" cy="240" r="1.5"/>
    <circle cx="250" cy="160" r="1.5"/>
  </g>
  <g stroke="#ffe9a8" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M185 95 v18 M176 104 h18"/>
    <path d="M640 100 v14 M633 107 h14"/>
  </g>

  <!-- moon -->
  <circle cx="672" cy="98" r="40" fill="#f4f1c9"/>
  <circle cx="656" cy="88" r="7" fill="#dedab0"/>
  <circle cx="684" cy="112" r="5" fill="#dedab0"/>

  <!-- alien hills -->
  <path d="M0 480 Q180 440 360 476 T800 468 V600 H0 Z" fill="#241a4d"/>
  <path d="M0 520 Q220 496 430 522 T800 512 V600 H0 Z" fill="#17103a"/>

  <!-- bicycle -->
  <g stroke="#7fe3ff" fill="none" stroke-width="6" stroke-linecap="round">
    <circle cx="230" cy="430" r="70"/>
    <circle cx="570" cy="430" r="70"/>
    <g stroke-width="2" opacity="0.55">
      <path d="M230 360 V500 M160 430 H300 M181 381 L279 479 M181 479 L279 381"/>
      <path d="M570 360 V500 M500 430 H640 M521 381 L619 479 M521 479 L619 381"/>
    </g>
    <path d="M230 430 L350 300 L470 300 L570 430"/>
    <path d="M350 300 L400 430 L230 430"/>
    <path d="M400 430 L470 300"/>
    <path d="M350 300 L340 268"/>
    <path d="M316 268 L364 268"/>
    <path d="M470 300 L480 262"/>
    <path d="M480 262 L514 256"/>
    <path d="M400 430 L396 464"/>
    <circle cx="400" cy="430" r="13" fill="#ff7ad9" stroke="none"/>
    <path d="M400 430 L378 458 M400 430 L424 456"/>
  </g>

  <!-- speed lines -->
  <g stroke="#7fe3ff" stroke-width="3" opacity="0.5" stroke-linecap="round">
    <path d="M120 350 H190 M100 380 H175 M130 410 H185"/>
  </g>

  <!-- pelican body -->
  <ellipse cx="415" cy="228" rx="72" ry="50" fill="#f4f6ff" stroke="#c9cfe8" stroke-width="2"/>
  <path d="M358 222 Q332 178 352 148 Q362 128 387 140 Q372 168 376 214 Z" fill="#e6eaff" stroke="#c9cfe8" stroke-width="2"/>

  <!-- space helmet -->
  <circle cx="358" cy="118" r="30" fill="#9fe8ff" opacity="0.35"/>
  <circle cx="358" cy="118" r="30" fill="none" stroke="#7fe3ff" stroke-width="3"/>
  <path d="M340 100 Q358 92 378 102" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7" stroke-linecap="round"/>

  <!-- pelican head -->
  <circle cx="358" cy="118" r="24" fill="#f4f6ff" stroke="#c9cfe8" stroke-width="2"/>
  <circle cx="368" cy="112" r="5" fill="#22223b"/>
  <circle cx="369.5" cy="110" r="1.6" fill="#fff"/>

  <!-- long beak + pouch -->
  <path d="M334 110 L262 126 L332 136 Z" fill="#ffc46b" stroke="#e08a1e" stroke-width="2" stroke-linejoin="round"/>
  <path d="M334 136 Q298 170 332 158 Q346 150 346 132 Z" fill="#ff9a55" stroke="#e08a1e" stroke-width="2"/>

  <!-- wing on handlebar -->
  <path d="M432 200 Q502 178 524 238 Q482 262 437 246 Z" fill="#dfe4f7" stroke="#b7bee0" stroke-width="2"/>
  <path d="M470 205 Q492 222 496 245 M450 208 Q468 226 470 248" fill="none" stroke="#b7bee0" stroke-width="2"/>

  <!-- legs pedaling -->
  <path d="M408 274 L400 430 L424 446" fill="none" stroke="#ffb14e" stroke-width="10" stroke-linecap="round"/>
  <path d="M452 274 L472 350 L432 392" fill="none" stroke="#ff9a55" stroke-width="10" stroke-linecap="round"/>

  <!-- tail -->
  <path d="M488 228 Q540 238 556 268 Q520 264 484 254 Z" fill="#e6eaff" stroke="#c9cfe8" stroke-width="2"/>
</svg>
