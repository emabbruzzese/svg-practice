  <path d="M410 275 L400 430 L425 445" fill="none" stroke="#f4a259" stroke-width="10" stroke-linecap="round"/>
  <path d="M450 275 L470 350 L430 390" fill="none" stroke="#e08e3c" stroke-width="10" stroke-linecap="round"/>

  <!-- wing -->
  <path d="M430 200 Q500 180 520 240 Q480 260 435 245 Z" fill="#ffe9b8" stroke="#ffb700" stroke-width="2"/>

  <!-- tail -->
  <path d="M490 230 Q540 240 555 270 Q520 265 485 255 Z" fill="#fff3d6" stroke="#ffb700" stroke-width="2"/>
