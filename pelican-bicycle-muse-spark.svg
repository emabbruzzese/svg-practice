    <path d="M480 60 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 Z"/>
    <path d="M600 200 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 Z"/>
    <path d="M120 260 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 Z"/>
  </g>
  <path d="M0 480 Q200 460 400 480 T800 480 V600 H0 Z" fill="#8fce8f"/>

  <!-- bicycle -->
  <g stroke="#333" fill="none" stroke-width="6" stroke-linecap="round">
